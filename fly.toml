# VERIDIQ Telegram long-poll worker on Fly.io
# Docs: docs/DEPLOY_TELEGRAM_FLY.md
#
# No [http_service] / [[services]]: the worker only calls api.telegram.org
# (outbound getUpdates). Machines without services stay always-on and are not
# auto-stopped by Fly Proxy.
#
# Replace app name after `fly apps create` / `fly launch` if needed.

app = 'veridiq-telegram-worker'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LOG_LEVEL = 'INFO'
  VERIDIQ_TELEGRAM_MODE = 'longpoll'
  VERIDIQ_TELEGRAM_AUTO_REPLY = '1'
  VERIDIQ_TELEGRAM_WELCOME = '1'
  VERIDIQ_TELEGRAM_REPLY_ONLY_MENTIONS = '0'

[processes]
  worker = 'python scripts/run_telegram_worker.py'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['worker']

# Allow long-poll HTTP to Telegram to finish before hard kill on deploy/stop.
kill_signal = 'SIGTERM'
kill_timeout = '30s'
