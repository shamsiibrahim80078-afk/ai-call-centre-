<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VERIDIQ — Truth. Verified. Empowered." />
    <meta name="theme-color" content="#05070F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>VERIDIQ — Truth. Verified. Empowered.</title>
    <!-- Telegram Mini App SDK (safe no-op outside Telegram WebView) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Classic script: silence *unsolicited* MetaMask inject spam before Vite.
      Does NOT wrap ethereum / block Clerk MetaMask sign-in. Enable MetaMask in
      Clerk Dashboard → User & Authentication → Web3. Console re-wrap in main.tsx.
    -->
    <script>
      (function () {
        var EVENTS = "__veridiq_wallet_noise_events__";
        if (window[EVENTS]) return;
        window[EVENTS] = true;
        var EXT = /chrome-extension:\/+nkbihfbeogaeaoehlefnkodbefgpgknn/i;
        /* Unsolicited inject only — leave user-initiated Web3 errors for Clerk UI */
        var MSG =
          /Error restoring session|Failed to connect to MetaMask|Could not establish connection\. Receiving end does not exist/i;
        function text(v) {
          if (v == null) return "";
          if (typeof v === "string") return v;
          var p = [];
          try {
            if (v.message != null) p.push(String(v.message));
            if (v.stack != null) p.push(String(v.stack));
            if (v.reason != null) p.push(text(v.reason));
            p.push(String(v));
          } catch (e) {}
          return p.join("\n");
        }
        function noise(v) {
          var t = text(v);
          if (!t) return false;
          if (MSG.test(t)) return true;
          return EXT.test(t) && /Error restoring session|Failed to connect|inpage|contentscript/i.test(t);
        }
        function silence(e) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
        window.addEventListener(
          "unhandledrejection",
          function (e) {
            if (noise(e.reason)) silence(e);
          },
          true
        );
        window.addEventListener(
          "rejectionhandled",
          function (e) {
            if (noise(e.reason)) silence(e);
          },
          true
        );
        window.addEventListener(
          "error",
          function (e) {
            if (noise(e.error) || noise(e.message)) silence(e);
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
